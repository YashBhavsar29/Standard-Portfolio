<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Shared Header</title>
</head>

<body>
    <header class="nav">
        <a href="#home"
            class="logo"
            aria-label="Yash Bhavsar home">Yash B.</a>

        <ul class="nav-links"
            id="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#resume">Resume</a></li>
        </ul>

        <div class="nav-right">
            <a class="icon-btn social-link social-link--linkedin"
                href="https://www.linkedin.com/in/YashBhavsar29"
                target="_blank"
                rel="noopener"
                aria-label="LinkedIn">
                <svg viewBox="0 0 24 24">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z" />
                    <rect x="2"
                        y="9"
                        width="4"
                        height="12" />
                    <circle cx="4"
                        cy="4"
                        r="2" />
                </svg>
            </a>
            <a class="icon-btn social-link social-link--github"
                href="https://github.com/YashBhavsar29"
                target="_blank"
                rel="noopener"
                aria-label="GitHub">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
                </svg>
            </a>
            <a class="icon-btn social-link social-link--mail"
                href="mailto:yashbhavsar.dev2007@gmail.com"
                target="_blank"
                rel="noopener"
                aria-label="Email">
                <svg viewBox="0 0 24 24">
                    <rect x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2" />
                    <path d="m3 7 9 6 9-6" />
                </svg>
            </a>

            <span class="divider"
                aria-hidden="true"></span>

            <button class="icon-btn"
                id="theme-toggle"
                type="button"
                aria-label="Switch to light theme">
                <svg viewBox="0 0 24 24"
                    aria-hidden="true">
                    <circle cx="12"
                        cy="12"
                        r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                </svg>
            </button>

            <button class="icon-btn menu-toggle"
                id="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="nav-links">
                <svg viewBox="0 0 24 24">
                    <line x1="3"
                        y1="7"
                        x2="21"
                        y2="7" />
                    <line x1="3"
                        y1="12"
                        x2="21"
                        y2="12" />
                    <line x1="3"
                        y1="17"
                        x2="21"
                        y2="17" />
                </svg>
            </button>
        </div>
    </header>
</body>

</html>
